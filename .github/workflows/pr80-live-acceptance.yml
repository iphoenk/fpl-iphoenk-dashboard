name: PR80 Live Official FPL + WebKit Acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live_api:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/deterministic-lineup-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      FPL_PREVIEW_URL: http://127.0.0.1:4173
      FPL_ACCEPTANCE_LEAGUE: '9477'
      FPL_ACCEPTANCE_ENTRY: '3462711'
      FPL_ACCEPTANCE_TIMEOUT_MS: '20000'
      FPL_ACCEPTANCE_P95_MS: '1000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: HTTP GET concurrency, actual FPL IDs, 1/3/5 GW, all 8 formations
        run: |
          npm ci --ignore-scripts
          npm run build
          node scripts/preview.mjs > /tmp/fpl-acceptance-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/decision/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/acceptance-live-preview.mjs
      - name: Upload reproducible API acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr80-live-api-${{ github.run_id }}
          path: artifacts/live-preview-acceptance.json
          if-no-files-found: warn
          retention-days: 7
  browser_webkit:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/deterministic-lineup-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FPL_PREVIEW_URL: http://127.0.0.1:4173
      FPL_ACCEPTANCE_ENTRY: '3462711'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated Playwright (not a production dependency)
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install WebKit + Chromium on CI runner
        run: npx playwright install --with-deps webkit chromium
      - name: Browser acceptance at four viewport sizes
        run: |
          npm run build
          node scripts/preview.mjs > /tmp/fpl-acceptance-webkit-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/decision/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/acceptance-webkit.mjs
      - name: Upload WebKit screenshot and acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr80-webkit-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
